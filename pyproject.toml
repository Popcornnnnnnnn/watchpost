[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "watchpost-agent"
version = "0.4.0"
description = "Headless local background bridge for your coding agent — zero-copy-paste head-starts delivered to your phone"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "Popcornnnnnnnn" },
]
keywords = ["ai-agents", "coding-agent", "chatops", "telegram", "slack", "feishu", "discord", "mcp", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/Popcornnnnnnnn/watchpost"
Repository = "https://github.com/Popcornnnnnnnn/watchpost"
Issues = "https://github.com/Popcornnnnnnnn/watchpost/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[project.scripts]
watchpost = "watchpost.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchpost"]

[tool.hatch.build.targets.sdist]
exclude = ["site", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
