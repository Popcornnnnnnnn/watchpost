[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "watchpost"
version = "0.3.0"
description = "Headless local background bridge for your coding agent — zero-copy-paste head-starts delivered to your phone"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/Popcornnnnnnnn/watchpost"
Repository = "https://github.com/Popcornnnnnnnn/watchpost"
Issues = "https://github.com/Popcornnnnnnnn/watchpost/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[project.scripts]
watchpost = "watchpost.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
